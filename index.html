<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Happy Birthday Pratu</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --champagne: #f3ede4;
            --champagne2: #e8d9c5;
            --gold: #b68b3a;
            --gold2: #e7c46a;
            --ink: #3b2f25;
            --shadow: rgba(0, 0, 0, 0.22);
            --black: #121212;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Poppins, sans-serif;
            background: linear-gradient(135deg, var(--champagne), var(--champagne2));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Optional local decor images */
        .decor-top,
        .decor-bottom {
            position: fixed;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 0;
            pointer-events: none;
            opacity: .9;
        }

        .decor-top {
            top: 0;
        }

        .decor-bottom {
            bottom: 0;
        }

        /* Ambient sparkle dust */
        .dust {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, .34) 0 2px, transparent 3px),
                radial-gradient(circle at 70% 12%, rgba(255, 255, 255, .22) 0 1.8px, transparent 3px),
                radial-gradient(circle at 86% 74%, rgba(255, 255, 255, .20) 0 1.6px, transparent 3px),
                radial-gradient(circle at 26% 88%, rgba(255, 255, 255, .24) 0 1.9px, transparent 3px);
            background-size: 420px 420px, 520px 520px, 480px 480px, 560px 560px;
            animation: dustDrift 10s ease-in-out infinite;
            opacity: .55;
        }

        @keyframes dustDrift {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Continuous big gold/black confetti */
        canvas#bgConfetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: .9;
        }

        /* Burst confetti canvas */
        canvas#burst {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 6;
        }

        .container {
            width: min(92%, 720px);
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 30px 80px var(--shadow);
            position: relative;
            z-index: 5;
            backdrop-filter: blur(8px);
            transform-origin: center;
            overflow: hidden;
        }

        /* Lively slide transitions */
        .t-pop {
            animation: tPop .65s cubic-bezier(.2, .9, .2, 1) both;
        }

        @keyframes tPop {
            from {
                opacity: 0;
                transform: translateY(12px) scale(.98);
                filter: blur(.3px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .t-swing {
            animation: tSwing .75s ease both;
        }

        @keyframes tSwing {
            from {
                opacity: 0;
                transform: rotate(-1.2deg) translateY(10px);
            }

            60% {
                opacity: 1;
                transform: rotate(0.9deg) translateY(0);
            }

            to {
                transform: rotate(0deg);
            }
        }

        .t-glow {
            animation: tGlow .9s ease both;
        }

        @keyframes tGlow {
            from {
                opacity: 0;
                transform: translateY(10px);
                box-shadow: 0 0 0 rgba(182, 139, 58, 0);
            }

            60% {
                opacity: 1;
                transform: translateY(0);
                box-shadow: 0 0 55px rgba(182, 139, 58, 0.28);
            }

            to {
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.22);
            }
        }

        .t-slide {
            animation: tSlide .75s ease both;
        }

        @keyframes tSlide {
            from {
                opacity: 0;
                transform: translateX(14px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 44px;
            margin: 0;
            color: var(--gold);
            letter-spacing: .3px;
            position: relative;
            z-index: 2;
        }

        /* TEXT BOX */
        .message-wrap {
            margin-top: 18px;
            border-radius: 22px;
            padding: 18px 16px;
            position: relative;
            z-index: 2;
            overflow: hidden;

            background: linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(246, 233, 235, 0.82));
            border: 1px solid rgba(182, 139, 58, 0.22);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Subtle moving balloons inside the message box (no gifs) */
        .message-deco {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: .28;
            filter: blur(.0px);
        }

        .b {
            position: absolute;
            bottom: -28%;
            width: 28px;
            height: 34px;
            border-radius: 50% 50% 48% 48%;
            background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .9), rgba(231, 196, 106, .65) 45%, rgba(182, 139, 58, .35) 72%, rgba(182, 139, 58, .15));
            box-shadow: 0 8px 18px rgba(0, 0, 0, .08);
            animation: floatUp linear infinite;
        }

        .b::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 100%;
            width: 1.5px;
            height: 38px;
            background: rgba(182, 139, 58, 0.35);
            transform: translateX(-50%);
        }

        /* a few different sizes/positions/speeds */
        .b1 {
            left: 10%;
            animation-duration: 7.8s;
            transform: scale(.85);
        }

        .b2 {
            left: 24%;
            animation-duration: 9.6s;
            transform: scale(.65);
            opacity: .22;
        }

        .b3 {
            left: 42%;
            animation-duration: 8.9s;
            transform: scale(.75);
        }

        .b4 {
            left: 63%;
            animation-duration: 10.4s;
            transform: scale(.55);
            opacity: .20;
        }

        .b5 {
            left: 78%;
            animation-duration: 8.2s;
            transform: scale(.70);
        }

        .b6 {
            left: 90%;
            animation-duration: 11.2s;
            transform: scale(.50);
            opacity: .18;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) scale(var(--s, 1));
            }

            to {
                transform: translateY(-160%) scale(var(--s, 1));
            }
        }

        .message {
            font-size: 18px;
            line-height: 1.75;
            color: var(--ink);
            margin: 0;
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 4px 6px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }

        /* message gif area (kept elegant + responsive) */
        .message-gif {
            display: none;
            margin: 14px auto 0;
            width: min(420px, 100%);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(182, 139, 58, 0.22);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.10);
            background: rgba(255, 255, 255, 0.55);
            position: relative;
            z-index: 2;
        }

        .message-gif.show {
            display: block;
        }

        .message-gif img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Stylish buttons */
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .btn {
            appearance: none;
            border: 0;
            border-radius: 999px;
            padding: 12px 18px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: .2px;
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold2), var(--gold));
            color: #ffffff;
            box-shadow: 0 14px 28px rgba(182, 139, 58, .28);
            position: relative;
        }

        .btn-primary::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0));
            opacity: .9;
            pointer-events: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px rgba(182, 139, 58, .32);
        }

        .btn-primary:active {
            transform: translateY(0px) scale(.99);
        }

        .btn-ghost {
            background: rgba(18, 18, 18, 0.06);
            color: #2b241e;
            border: 1px solid rgba(18, 18, 18, 0.10);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.08);
        }

        .btn-ghost:hover {
            transform: translateY(-2px);
            filter: brightness(1.02);
        }

        .btn-ghost:active {
            transform: translateY(0px) scale(.99);
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            display: inline-grid;
            place-items: center;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
        }

        /* Master slide */
        .master-slide {
            background: linear-gradient(135deg, #0f1b2d, #1b2f52, #2a3f6f);
            color: #fff;
            box-shadow: 0 38px 110px rgba(16, 24, 40, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .master-slide:before {
            content: "";
            position: absolute;
            inset: -2px;
            background: radial-gradient(1000px 420px at 20% 10%, rgba(231, 196, 106, 0.24), transparent 60%),
                radial-gradient(900px 380px at 85% 85%, rgba(246, 233, 235, 0.16), transparent 60%);
            pointer-events: none;
        }

        .master-slide h1 {
            color: #fff;
            font-size: 52px;
        }

        .master-sub {
            margin-top: 6px;
            font-family: Playfair Display, serif;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: .85;
        }

        .gift-area {
            margin-top: 18px;
            display: grid;
            gap: 14px;
            justify-items: center;
            position: relative;
            z-index: 2;
        }

        .bubble {
            display: none;
            position: relative;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            color: #1b2f52;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
            animation: bob 1.2s ease-in-out infinite;
        }

        .bubble:after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -8px;
            width: 16px;
            height: 16px;
            background: rgba(255, 255, 255, 0.92);
            transform: translateX(-50%) rotate(45deg);
            border-radius: 3px;
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .gift-box {
            width: 150px;
            cursor: pointer;
            transition: transform .25s ease;
            filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.35));
            user-select: none;
        }

        .gift-box:hover {
            transform: scale(1.06);
        }

        .reveal {
            display: none;
            margin-top: 6px;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
        }

        .reveal.show {
            display: block;
        }

        /* Candles: 3 big + 4 small */
        .candles {
            display: none;
            margin-top: 2px;
            justify-content: center;
            gap: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
            max-width: 340px;
        }

        .candles.show {
            display: flex;
        }

        .candle {
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(231, 196, 106, 0.35));
            position: relative;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
        }

        .candle.big {
            width: 18px;
            height: 62px;
        }

        .candle.small {
            width: 14px;
            height: 44px;
        }

        .candle:before {
            content: "";
            position: absolute;
            top: -12px;
            left: 50%;
            width: 2px;
            height: 12px;
            background: rgba(255, 255, 255, 0.7);
            transform: translateX(-50%);
        }

        .flame {
            position: absolute;
            top: -26px;
            left: 50%;
            width: 14px;
            height: 22px;
            transform: translateX(-50%);
            background: radial-gradient(circle at 30% 30%, #fff 0 25%, #ffd166 40%, #ff7a59 70%, transparent 72%);
            border-radius: 50%;
            filter: drop-shadow(0 0 12px rgba(255, 209, 102, 0.65));
            animation: flicker 0.12s infinite alternate;
        }

        .candle.small .flame {
            width: 12px;
            height: 18px;
            top: -22px;
        }

        @keyframes flicker {
            from {
                transform: translateX(-50%) rotate(-2deg) scale(0.98);
                opacity: .95;
            }

            to {
                transform: translateX(-50%) rotate(2deg) scale(1.03);
                opacity: 1;
            }
        }

        .flame.off {
            animation: none;
            opacity: 0;
        }

        .blow-hint {
            display: none;
            margin-top: 4px;
            font-size: 13px;
            opacity: .85;
            text-align: center;
        }

        .blow-hint.show {
            display: block;
        }

        /* His photo bigger + no cropping */
        .his-photo-wrap {
            display: none;
            margin-top: 10px;
            position: relative;
            width: 260px;
            height: 300px;
        }

        .his-photo-wrap.show {
            display: block;
        }

        .his-photo {
            width: 260px;
            height: 300px;
            border-radius: 24px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.10);
            border: 3px solid rgba(231, 196, 106, 0.75);
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.35);
            padding: 6px;
        }

        .sparkle-ring {
            position: absolute;
            inset: -10px;
            border-radius: 28px;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(231, 196, 106, .85) 0 2px, transparent 3px),
                radial-gradient(circle at 65% 10%, rgba(255, 255, 255, .95) 0 2px, transparent 3px),
                radial-gradient(circle at 85% 65%, rgba(231, 196, 106, .80) 0 2px, transparent 3px),
                radial-gradient(circle at 25% 85%, rgba(255, 255, 255, .75) 0 2px, transparent 3px);
            animation: sparkle 1.4s ease-in-out infinite;
            opacity: .95;
        }

        @keyframes sparkle {

            0%,
            100% {
                filter: blur(0px);
                transform: scale(1);
            }

            50% {
                filter: blur(.2px);
                transform: scale(1.01);
            }
        }

        /* Final slide (no title at top) */
        .final-slide {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(246, 233, 235, 0.98));
        }

        .final-photo {
            margin-top: 10px;
            width: 190px;
            height: 190px;
            border-radius: 24px;
            object-fit: cover;
            border: 3px solid rgba(182, 139, 58, 0.6);
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.20);
            background: rgba(0, 0, 0, 0.03);
        }

        .signature {
            margin-top: 14px;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--gold);
            text-align: center;
        }

        /* Mobile base */
        @media (max-width: 480px) {
            .container {
                padding: 30px 18px;
            }

            h1 {
                font-size: 38px;
            }

            .master-slide h1 {
                font-size: 44px;
            }

            .message {
                font-size: 16px;
            }

            .gift-box {
                width: 132px;
            }

            .his-photo-wrap {
                width: 230px;
                height: 270px;
            }

            .his-photo {
                width: 230px;
                height: 270px;
            }

            .message-wrap {
                padding: 16px 14px;
            }

            .message-gif {
                border-radius: 16px;
            }
        }

        /* ===========================
           MOBILE FIX: MASTER SLIDE FIT (NO OVERLAY)
           Master content scrolls, controls stay below content
           =========================== */
        @media (max-width: 480px) {

            /* Make the card a fixed-height layout on mobile */
            .container.master-slide {
                height: 92vh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                padding-bottom: calc(16px + env(safe-area-inset-bottom));
            }

            /* Make only the master content area scrollable */
            .container.master-slide #masterArea {
                flex: 1 1 auto;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 10px;
            }

            /* Controls are normal flow at bottom (no overlap) */
            .container.master-slide .controls {
                flex: 0 0 auto;
                position: relative;
                margin-top: 12px;
                padding-bottom: env(safe-area-inset-bottom);
                background: transparent;
            }

            /* Slightly reduce master elements to avoid excessive scroll */
            .container.master-slide .gift-area {
                gap: 10px;
            }

            .container.master-slide .gift-box {
                width: 120px;
            }

            .container.master-slide .his-photo-wrap {
                width: 200px;
                height: 230px;
            }

            .container.master-slide .his-photo {
                width: 200px;
                height: 230px;
            }

            .container.master-slide .master-sub {
                margin-top: 2px;
                font-size: 12px;
                letter-spacing: 1.6px;
            }
        }
    </style>
</head>

<body>

    <!-- Optional local assets -->
    <img src="birthday-decor-top.png" class="decor-top" alt="" />
    <img src="birthday-decor-bottom.png" class="decor-bottom" alt="" />
    <div class="dust" aria-hidden="true"></div>

    <canvas id="bgConfetti"></canvas>
    <canvas id="burst"></canvas>

    <audio id="bgMusic" autoplay loop>
        <source src="Vennilave.mp3" type="audio/mpeg">
    </audio>

    <audio id="birthdayMusic">
        <source src="happy-birthday.mp3" type="audio/mpeg">
    </audio>

    <div class="container t-pop" id="card">
        <h1 id="title">Unnodu Naan</h1>

        <!-- Standard message area -->
        <div id="standardArea">
            <div class="message-wrap" id="msgWrap">
                <div class="message-deco" aria-hidden="true">
                    <div class="b b1"></div>
                    <div class="b b2"></div>
                    <div class="b b3"></div>
                    <div class="b b4"></div>
                    <div class="b b5"></div>
                    <div class="b b6"></div>
                </div>
                <p class="message" id="message">Press Start</p>
            </div>

            <!-- GIF holder for specific slides -->
            <div class="message-gif" id="messageGifWrap" aria-hidden="true">
                <img id="messageGif" src="" alt="" />
            </div>
        </div>

        <!-- MASTER SLIDE AREA -->
        <div id="masterArea" style="display:none;">
            <div class="master-sub">A LITTLE SURPRISE FOR YOU</div>

            <div class="gift-area">
                <div class="bubble" id="giftBubble">Click here</div>

                <img src="gift.png" class="gift-box" id="giftBox" alt="Gift box" />

                <div class="candles" id="candles">
                    <!-- 3 BIG -->
                    <div class="candle big">
                        <div class="flame"></div>
                    </div>
                    <div class="candle big">
                        <div class="flame"></div>
                    </div>
                    <div class="candle big">
                        <div class="flame"></div>
                    </div>
                    <!-- 4 SMALL -->
                    <div class="candle small">
                        <div class="flame"></div>
                    </div>
                    <div class="candle small">
                        <div class="flame"></div>
                    </div>
                    <div class="candle small">
                        <div class="flame"></div>
                    </div>
                    <div class="candle small">
                        <div class="flame"></div>
                    </div>
                </div>

                <div class="blow-hint" id="blowHint">Tap each flame to blow the candles out.</div>

                <div class="reveal" id="revealText">
                    Happy Birthday, Pratu.<br />
                    You deserve the very best today and always.
                </div>

                <div class="his-photo-wrap" id="hisPhotoWrap">
                    <div class="sparkle-ring" aria-hidden="true"></div>
                    <img src="his-photo.jpg" class="his-photo" alt="Pratu photo" />
                </div>
            </div>
        </div>

        <!-- FINAL SLIDE AREA (no top heading) -->
        <div id="finalArea" style="display:none;">
            <div class="message-wrap" style="margin-top:16px;">
                <div class="message-deco" aria-hidden="true">
                    <div class="b b1"></div>
                    <div class="b b2"></div>
                    <div class="b b3"></div>
                    <div class="b b4"></div>
                    <div class="b b5"></div>
                    <div class="b b6"></div>
                </div>
                <div style="position:relative; z-index:1; width:100%;">
                    <img src="your-photo.jpg" class="final-photo" alt="Your photo" />
                    <div class="signature">With all the paasams – Theema</div>
                </div>
            </div>

            <div style="margin-top:14px; text-align:center;">
                <button class="btn btn-primary" id="replayBtnFinal">
                    <span class="btn-icon">⟲</span>
                    Replay
                </button>
            </div>
        </div>

        <div class="controls" id="controlsBar">
            <button class="btn btn-primary" id="startBtn">
                <span class="btn-icon">▶</span>
                Start
            </button>

            <button class="btn btn-primary" id="nextBtn" style="display:none;">
                <span class="btn-icon">➜</span>
                Next
            </button>

            <button class="btn btn-ghost" id="muteBtn">
                <span class="btn-icon" id="muteIcon">🔊</span>
                <span id="muteText">Mute</span>
            </button>
        </div>
    </div>

    <script>
        const MESSAGES = [
            { text: "The music is playing…...🎶" },
            { text: "Your favourite song. So this already feels like a movie scene." },
            { text: "Lights low. Screen glowing. And today’s main character?" },
            { text: "You. ✨" },

            { text: "Hello, Birthday Boy.", gif: "hello.gif" },

            { text: "Before anything else - thank you for existing. You have no idea how much light you bring into my life." },

            { master: true },

            { text: "Happy Birthday, Pratu!!!!!! 🎂🎉" },

            { text: "You are loved. Fully. Properly. Clearly.", gif: "flying-kiss.gif" },

            { text: "Now come collect your birthday hugs before I file a complaint." },

            { final: true }
        ];

        let index = -1;

        const card = document.getElementById("card");
        const title = document.getElementById("title");

        const standardArea = document.getElementById("standardArea");
        const msgEl = document.getElementById("message");

        const masterArea = document.getElementById("masterArea");
        const finalArea = document.getElementById("finalArea");

        const controlsBar = document.getElementById("controlsBar");
        const startBtn = document.getElementById("startBtn");
        const nextBtn = document.getElementById("nextBtn");
        const muteBtn = document.getElementById("muteBtn");
        const muteIcon = document.getElementById("muteIcon");
        const muteText = document.getElementById("muteText");

        const bgMusic = document.getElementById("bgMusic");
        const birthdayMusic = document.getElementById("birthdayMusic");

        const giftBox = document.getElementById("giftBox");
        const giftBubble = document.getElementById("giftBubble");
        const revealText = document.getElementById("revealText");
        const candles = document.getElementById("candles");
        const blowHint = document.getElementById("blowHint");
        const hisPhotoWrap = document.getElementById("hisPhotoWrap");
        const replayBtnFinal = document.getElementById("replayBtnFinal");

        const messageGifWrap = document.getElementById("messageGifWrap");
        const messageGif = document.getElementById("messageGif");

        // Autoplay fallback
        document.body.addEventListener("click", () => {
            bgMusic.play().catch(() => { });
        }, { once: false });

        // Transitions
        const transitionClasses = ["t-pop", "t-swing", "t-glow", "t-slide"];
        function applyTransition(i) {
            transitionClasses.forEach(c => card.classList.remove(c));
            const cls = transitionClasses[i % transitionClasses.length];
            void card.offsetWidth;
            card.classList.add(cls);
        }

        // Audio fade
        let fadeTimer = null;
        function fadeVolume(audioEl, to, ms) {
            if (!audioEl) return;
            if (fadeTimer) window.clearInterval(fadeTimer);

            const from = audioEl.volume;
            const steps = Math.max(1, Math.floor(ms / 40));
            let n = 0;

            fadeTimer = window.setInterval(() => {
                n++;
                const t = n / steps;
                audioEl.volume = Math.max(0, Math.min(1, from + (to - from) * t));
                if (n >= steps) {
                    window.clearInterval(fadeTimer);
                    fadeTimer = null;
                    audioEl.volume = to;
                }
            }, 40);
        }
        function duckBgMusic() { fadeVolume(bgMusic, 0.10, 1200); }
        function restoreBgMusic() { fadeVolume(bgMusic, 1.0, 1400); }

        let giftOpened = false;

        function resetSlideAreas() {
            standardArea.style.display = "block";
            masterArea.style.display = "none";
            finalArea.style.display = "none";

            giftBubble.style.display = "none";
            revealText.classList.remove("show");
            candles.classList.remove("show");
            blowHint.classList.remove("show");
            hisPhotoWrap.classList.remove("show");

            document.querySelectorAll(".flame").forEach(f => f.classList.remove("off"));

            card.classList.remove("master-slide", "final-slide");
            giftOpened = false;

            // reset gif
            messageGifWrap.classList.remove("show");
            messageGif.removeAttribute("src");

            controlsBar.style.display = "flex";
        }

        function showMessage(i) {
            applyTransition(i);
            resetSlideAreas();

            const item = MESSAGES[i];
            title.textContent = "You, Always.";

            if (item.master) {
                card.classList.add("master-slide");
                title.textContent = "Happy Birthday, Pratu";

                standardArea.style.display = "none";
                masterArea.style.display = "block";
                giftBubble.style.display = "inline-block";

                // No Next until gift is clicked
                nextBtn.style.display = "none";
                return;
            }

            if (item.final) {
                card.classList.add("final-slide");
                title.textContent = " ";

                standardArea.style.display = "none";
                finalArea.style.display = "block";
                controlsBar.style.display = "none";
                return;
            }

            msgEl.textContent = item.text;

            // show gif for specific messages
            if (item.gif) {
                messageGif.src = item.gif;
                messageGifWrap.classList.add("show");
            } else {
                messageGifWrap.classList.remove("show");
                messageGif.removeAttribute("src");
            }

            nextBtn.textContent = "Next";
            nextBtn.style.display = "inline-flex";

            const nextIsFinal = (i + 1 < MESSAGES.length) && MESSAGES[i + 1].final;
            if (nextIsFinal) nextBtn.textContent = "Finish";
        }

        // Master gift open
        giftBox.addEventListener("click", () => {
            if (giftOpened) return;
            giftOpened = true;

            giftBubble.style.display = "none";
            duckBgMusic();

            birthdayMusic.currentTime = 0;
            birthdayMusic.play().catch(() => { });

            revealText.classList.add("show");
            candles.classList.add("show");
            blowHint.classList.add("show");
            hisPhotoWrap.classList.add("show");

            burstConfetti(320);

            nextBtn.style.display = "inline-flex";
            nextBtn.textContent = "Next";
        });

        // Blow candles
        document.addEventListener("click", (e) => {
            const flame = (e.target && e.target.classList && e.target.classList.contains("flame")) ? e.target : null;
            if (!flame) return;

            flame.classList.add("off");
            const allOff = Array.from(document.querySelectorAll("#candles .flame")).every(f => f.classList.contains("off"));
            if (allOff) {
                burstConfetti(200);
                blowHint.textContent = "Make a wish. I am making one too.";
            }
        });

        // Buttons
        startBtn.addEventListener("click", () => {
            index = 0;
            showMessage(index);
            startBtn.style.display = "none";
            nextBtn.style.display = "inline-flex";
        });

        nextBtn.addEventListener("click", () => {
            const current = MESSAGES[index];

            if (current && current.master) {
                restoreBgMusic();
                birthdayMusic.pause();
                birthdayMusic.currentTime = 0;
            }

            if (index < MESSAGES.length - 1) {
                index++;
                showMessage(index);
            }
        });

        function replayAll() {
            birthdayMusic.pause();
            birthdayMusic.currentTime = 0;
            bgMusic.volume = 1.0;

            controlsBar.style.display = "flex";
            startBtn.style.display = "none";
            nextBtn.style.display = "inline-flex";
            nextBtn.textContent = "Next";

            index = 0;
            showMessage(index);
        }

        replayBtnFinal.addEventListener("click", replayAll);

        muteBtn.addEventListener("click", () => {
            bgMusic.muted = !bgMusic.muted;
            muteIcon.textContent = bgMusic.muted ? "🔈" : "🔊";
            muteText.textContent = bgMusic.muted ? "Unmute" : "Mute";
        });

        // -----------------------
        // Continuous BIG confetti background
        // -----------------------
        const bgCanvas = document.getElementById("bgConfetti");
        const bgCtx = bgCanvas.getContext("2d");

        function resizeBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeBg);
        resizeBg();

        const bgPalette = ["#b68b3a", "#e7c46a", "#121212", "#ffffff"];
        let bgPieces = [];

        function seedBgConfetti() {
            bgPieces = [];
            const density = Math.min(260, Math.floor((window.innerWidth * window.innerHeight) / 5200));
            for (let i = 0; i < density; i++) {
                bgPieces.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    w: 10 + Math.random() * 16,
                    h: 5 + Math.random() * 10,
                    vy: 0.8 + Math.random() * 1.8,
                    vx: -0.45 + Math.random() * 0.9,
                    rot: Math.random() * Math.PI,
                    vr: -0.035 + Math.random() * 0.07,
                    c: bgPalette[Math.floor(Math.random() * bgPalette.length)],
                    a: 0.22 + Math.random() * 0.22
                });
            }
        }
        seedBgConfetti();

        function drawBgConfetti() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            for (const p of bgPieces) {
                p.x += p.vx;
                p.y += p.vy;
                p.rot += p.vr;

                if (p.y > bgCanvas.height + 30) p.y = -30;
                if (p.x > bgCanvas.width + 30) p.x = -30;
                if (p.x < -30) p.x = bgCanvas.width + 30;

                bgCtx.save();
                bgCtx.translate(p.x, p.y);
                bgCtx.rotate(p.rot);
                bgCtx.globalAlpha = p.a;
                bgCtx.fillStyle = p.c;
                bgCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                bgCtx.restore();
            }
            requestAnimationFrame(drawBgConfetti);
        }
        drawBgConfetti();

        // -----------------------
        // Burst confetti
        // -----------------------
        const burstCanvas = document.getElementById("burst");
        const burstCtx = burstCanvas.getContext("2d");

        function resizeBurst() {
            burstCanvas.width = window.innerWidth;
            burstCanvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeBurst);
        resizeBurst();

        let particles = [];
        let running = false;

        function burstConfetti(count) {
            const palette = ["#b68b3a", "#e7c46a", "#ffffff", "#121212"];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: window.innerWidth * 0.5 + (Math.random() * 160 - 80),
                    y: window.innerHeight * 0.34 + (Math.random() * 80 - 40),
                    vx: (Math.random() * 10 - 5),
                    vy: (Math.random() * -11 - 3),
                    g: 0.18 + Math.random() * 0.14,
                    rot: Math.random() * Math.PI,
                    vr: (Math.random() * 0.35 - 0.175),
                    w: 8 + Math.random() * 14,
                    h: 4 + Math.random() * 10,
                    life: 120 + Math.random() * 60,
                    color: palette[Math.floor(Math.random() * palette.length)]
                });
            }
            if (!running) {
                running = true;
                requestAnimationFrame(tickBurst);
            }
        }

        function tickBurst() {
            burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.g;
                p.rot += p.vr;
                p.life -= 1;

                burstCtx.save();
                burstCtx.translate(p.x, p.y);
                burstCtx.rotate(p.rot);
                burstCtx.globalAlpha = Math.max(0, Math.min(1, p.life / 170));
                burstCtx.fillStyle = p.color;
                burstCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                burstCtx.restore();
            });

            particles = particles.filter(p => p.life > 0 && p.y < burstCanvas.height + 60);

            if (particles.length) {
                requestAnimationFrame(tickBurst);
            } else {
                running = false;
                burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
            }
        }

        // initial
        msgEl.textContent = "Press Start";
    </script>

</body>
